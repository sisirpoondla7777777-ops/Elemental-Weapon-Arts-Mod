name: Build Elemental Weapon Arts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        working-directory: ./elemental-weapon-arts-template-1.21.11 (1)
        run: chmod +x gradlew

      - name: Build mod
        working-directory: ./elemental-weapon-arts-template-1.21.11 (1)
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Weapon-Arts
          path: |
            elemental-weapon-arts-template-1.21.11 (1)/build/libs/*.jar
            !elemental-weapon-arts-template-1.21.11 (1)/build/libs/*-sources.jar
